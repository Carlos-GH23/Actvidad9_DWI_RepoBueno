<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulación POST con Reqres y Avatar</title>
  <link rel="stylesheet" href="form_style.css" />
</head>
<body>
  <h1>Crear Usuario (Simulación POST)</h1>
  
  <form id="userForm">
    <label>
      Nombre:
      <input type="text" id="first_name" name="first_name" required />
    </label>
    <label>
      Apellido:
      <input type="text" id="last_name" name="last_name" required />
    </label>
    <label>
      Email:
      <input type="email" id="email" name="email" required />
    </label>
    <label>
      URL Avatar:
      <input type="url" id="avatar" name="avatar" placeholder="https://ejemplo.com/miavatar.jpg" required />
    </label>
    <button type="submit">Enviar</button>
  </form>

  <div id="response"></div>

  <script src="form_script.js"></script>
</body>
</html>
